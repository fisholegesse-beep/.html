<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ሳምንታዊ የሥራ አፈፃፀም ሪፖርትና ግምገማ</title>
    <style>
        :root {
            --primary-color: #6a1b9a; /* የባንክ አገልግሎት መለያ ቀለም */
            --secondary-color: #8e24aa;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 550px;
        }

        h2, h3 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 12px;
        }

        .card {
            background: var(--card-bg);
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .section-title {
            background: #f3e5f5;
            color: var(--primary-color);
            padding: 6px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            margin-top: 15px;
            margin-bottom: 10px;
            border-left: 4px solid var(--primary-color);
        }

        .form-group {
            margin-bottom: 12px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 13px;
        }

        input, textarea, select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 13px;
        }

        textarea {
            resize: vertical;
            height: 60px;
        }

        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #4a148c;
        }

        .report-item {
            border-bottom: 1px solid #eeeeee;
            padding: 12px 0;
            font-size: 13px;
        }

        .report-item:last-child {
            border-bottom: none;
        }

        .badge {
            background-color: #e1bee7;
            color: #4a148c;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }

        .data-grid {
            background: #fafafa;
            padding: 8px;
            border-radius: 6px;
            margin: 6px 0;
            border: 1px solid #eee;
        }

        .rating {
            color: #ff9800;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>የሰራተኞች ሳምንታዊ አፈፃፀም ሪፖርት</h2>

    <!-- Form Section -->
    <div class="card">
        <h3>አዲስ ሪፖርት መሙያ</h3>
        <form id="reportForm">
            
            <div class="form-group grid-2">
                <div>
                    <label for="staffName">የሰራተኛው ስም</label>
                    <input type="text" id="staffName" placeholder="ስም ያስገቡ" required>
                </div>
                <div>
                    <label for="weekDate">የሳምንቱ መደምደሚያ</label>
                    <input type="date" id="weekDate" required>
                </div>
            </div>

            <!-- Deposit Section -->
            <div class="section-title">1. የተቀማጭ ገንዘብ (Deposit) አፈፃፀም</div>
            <div class="grid-3">
                <div class="form-group">
                    <label for="dailyDeposit">የቀን (ብር)</label>
                    <input type="number" id="dailyDeposit" placeholder="0.00" min="0" step="any">
                </div>
                <div class="form-group">
                    <label for="monthlyDeposit">የወር (ብር)</label>
                    <input type="number" id="monthlyDeposit" placeholder="0.00" min="0" step="any">
                </div>
                <div class="form-group">
                    <label for="quarterlyDeposit">የሩብ ዓመት (ብር)</label>
                    <input type="number" id="quarterlyDeposit" placeholder="0.00" min="0" step="any">
                </div>
            </div>

            <!-- Digital Banking & Products Section -->
            <div class="section-title">2. ዲጂታል ባንኪንግ እና አዳዲስ ሂሳቦች (በብዛት)</div>
            <div class="grid-3">
                <div class="form-group">
                    <label for="mbCount">Mobile Banking</label>
                    <input type="number" id="mbCount" placeholder="0" min="0">
                </div>
                <div class="form-group">
                    <label for="atmCount">ATM Card</label>
                    <input type="number" id="atmCount" placeholder="0" min="0">
                </div>
                <div class="form-group">
                    <label for="cbeBirrCount">CBE Birr</label>
                    <input type="number" id="cbeBirrCount" placeholder="0" min="0">
                </div>
            </div>

            <div class="grid-3">
                <div class="form-group">
                    <label for="internetBanking">Internet Bank.</label>
                    <input type="number" id="internetBanking" placeholder="0" min="0">
                </div>
                <div class="form-group">
                    <label for="agentCount">Agent Banking</label>
                    <input type="number" id="agentCount" placeholder="0" min="0">
                </div>
                <div class="form-group">
                    <label for="merchantCount">Merchant</label>
                    <input type="number" id="merchantCount" placeholder="0" min="0">
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="newAccounts">አዳዲስ ሂሳብ ከፈታ (Acc.)</label>
                    <input type="number" id="newAccounts" placeholder="0" min="0">
                </div>
                <div class="form-group">
                    <label for="loansProcessed">ብድር/Loans (በብር/ብዛት)</label>
                    <input type="text" id="loansProcessed" placeholder="ለምሳሌ፦ 2 (500,000)">
                </div>
            </div>

            <!-- Evaluation and Remarks -->
            <div class="section-title">3. ተጨማሪ መረጃ እና ግምገማ</div>
            <div class="form-group">
                <label for="challenges">ያጋጠሙ ችግሮች / የቀጣይ ሳምንት ዕቅድ</label>
                <textarea id="challenges" placeholder="ያጋጠሙ ተዳክሞዎች እና የቀጣይ ሳምንት ግብ..."></textarea>
            </div>

            <div class="form-group">
                <label for="rating">የሥራ አፈፃፀም ደረጃ</label>
                <select id="rating" required>
                    <option value="5">⭐⭐⭐⭐⭐ (በጣም ከፍተኛ - 5/5)</option>
                    <option value="4">⭐⭐⭐⭐ (ከፍተኛ - 4/5)</option>
                    <option value="3">⭐⭐⭐ (መካከለኛ - 3/5)</option>
                    <option value="2">⭐⭐ (ዝቅተኛ - 2/5)</option>
                    <option value="1">⭐ (በጣም ዝቅተኛ - 1/5)</option>
                </select>
            </div>

            <button type="submit">ሪፖርት መዝግብ / ላክ</button>
        </form>
    </div>

    <!-- Reports View Section -->
    <div class="card">
        <h3>የተላኩ ሪፖርቶችና ግምገማዎች</h3>
        <div id="reportsList">
            <p style="text-align: center; color: #777777;">ምንም የተመዘገበ ሪፖርት የለም።</p>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', loadReports);

    const reportForm = document.getElementById('reportForm');
    const reportsList = document.getElementById('reportsList');

    reportForm.addEventListener('submit', function(e) {
        e.preventDefault();

        const newReport = {
            id: Date.now(),
            staffName: document.getElementById('staffName').value,
            weekDate: document.getElementById('weekDate').value,
            dailyDeposit: document.getElementById('dailyDeposit').value || '0',
            monthlyDeposit: document.getElementById('monthlyDeposit').value || '0',
            quarterlyDeposit: document.getElementById('quarterlyDeposit').value || '0',
            mbCount: document.getElementById('mbCount').value || '0',
            atmCount: document.getElementById('atmCount').value || '0',
            cbeBirrCount: document.getElementById('cbeBirrCount').value || '0',
            internetBanking: document.getElementById('internetBanking').value || '0',
            agentCount: document.getElementById('agentCount').value || '0',
            merchantCount: document.getElementById('merchantCount').value || '0',
            newAccounts: document.getElementById('newAccounts').value || '0',
            loansProcessed: document.getElementById('loansProcessed').value || '-',
            challenges: document.getElementById('challenges').value,
            rating: document.getElementById('rating').value
        };

        let reports = JSON.parse(localStorage.getItem('bank_weekly_reports') || '[]');
        reports.unshift(newReport);
        localStorage.setItem('bank_weekly_reports', JSON.stringify(reports));

        reportForm.reset();
        loadReports();
    });

    function loadReports() {
        let reports = JSON.parse(localStorage.getItem('bank_weekly_reports') || '[]');
        
        if (reports.length === 0) {
            reportsList.innerHTML = '<p style="text-align: center; color: #777777;">ምንም የተመዘገበ ሪፖርት የለም።</p>';
            return;
        }

        reportsList.innerHTML = '';
        reports.forEach(report => {
            const stars = '⭐'.repeat(parseInt(report.rating));
            const item = document.createElement('div');
            item.className = 'report-item';
            item.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                    <strong style="font-size: 15px; color: var(--primary-color);">${escapeHtml(report.staffName)}</strong>
                    <span class="badge">${escapeHtml(report.weekDate)}</span>
                </div>
                
                <div class="data-grid">
                    <strong>💰 ዲፖዚት:</strong> ቀን: ${escapeHtml(report.dailyDeposit)} | ወር: ${escapeHtml(report.monthlyDeposit)} | ሩብ ዓመት: ${escapeHtml(report.quarterlyDeposit)}
                </div>

                <div class="data-grid">
                    <strong>📱 ዲጂታል ባንኪንግ:</strong><br>
                    • MB: ${escapeHtml(report.mbCount)} | ATM: ${escapeHtml(report.atmCount)} | CBE Birr: ${escapeHtml(report.cbeBirrCount)}<br>
                    • Internet Bank: ${escapeHtml(report.internetBanking)} | Agent: ${escapeHtml(report.agentCount)} | Merchant: ${escapeHtml(report.merchantCount)}
                </div>

                <div class="data-grid">
                    <strong>📋 አዳዲስ ሂሳቦችና ብድር:</strong><br>
                    • አዲስ ሂሳብ: ${escapeHtml(report.newAccounts)} | ብድር (Loans): ${escapeHtml(report.loansProcessed)}
                </div>

                ${report.challenges ? `<p style="margin: 5px 0;"><strong>ማስታወሻ/ዕቅድ:</strong> ${escapeHtml(report.challenges)}</p>` : ''}
                <p style="margin: 5px 0;" class="rating"><strong>ግምገማ:</strong> ${stars} (${report.rating}/5)</p>
            `;
            reportsList.appendChild(item);
        });
    }

    function escapeHtml(text) {
        return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
    }
</script>

</body>
</html>
